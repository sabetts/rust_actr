name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (for example v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  windows:
    name: build (windows-x86_64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_actr7
            rust_actr7/python

      - name: install maturin
        run: python -m pip install "maturin>=1.9,<2.0"

      - name: test
        run: cargo test --locked --manifest-path rust_actr7/Cargo.toml

      - name: build binary
        run: cargo build --release --locked --features env --manifest-path rust_actr7/Cargo.toml

      - name: build wheel
        run: maturin build --release --locked --manifest-path rust_actr7/python/Cargo.toml --out dist/wheels

      - name: smoke test and stage
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist/wheels/rust_actr-*.whl | Select-Object -First 1
          if (-not $wheel) { throw "no wheel found" }
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust_actr7/python/tutorial/unit1/count.py | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rust_actr7/python/tutorial/unit5/grouped.py | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/stage_release.py `
            --platform windows-x86_64 `
            --binary rust_actr7/target/release/actr.exe `
            --wheel $wheel.FullName `
            --dist dist `
            --zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: actr-windows-x86_64
          path: dist/actr-*-windows-x86_64.zip
          if-no-files-found: error

  macos:
    name: build (macos-universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_actr7
            rust_actr7/python

      - name: install maturin
        run: python -m pip install "maturin>=1.9,<2.0"

      - name: test
        run: cargo test --locked --manifest-path rust_actr7/Cargo.toml

      - name: build binaries
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked --features env --manifest-path rust_actr7/Cargo.toml --target aarch64-apple-darwin
          cargo build --release --locked --features env --manifest-path rust_actr7/Cargo.toml --target x86_64-apple-darwin

      - name: lipo universal binary
        run: |
          mkdir -p dist
          lipo -create \
            rust_actr7/target/aarch64-apple-darwin/release/actr \
            rust_actr7/target/x86_64-apple-darwin/release/actr \
            -output dist/actr

      - name: build wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: maturin build --release --locked --target universal2-apple-darwin --manifest-path rust_actr7/python/Cargo.toml --out dist/wheels

      - name: smoke test and stage
        run: |
          wheel=$(ls dist/wheels/rust_actr-*.whl | head -n 1)
          python -m pip install --force-reinstall --no-deps "$wheel"
          python rust_actr7/python/tutorial/unit1/count.py > /dev/null
          python rust_actr7/python/tutorial/unit5/grouped.py > /dev/null
          python scripts/stage_release.py \
            --platform macos-universal \
            --binary dist/actr \
            --wheel "$wheel" \
            --dist dist \
            --zip

      - uses: actions/upload-artifact@v4
        with:
          name: actr-macos-universal
          path: dist/actr-*-macos-universal.zip
          if-no-files-found: error

  linux:
    name: build (linux-x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust_actr7
            rust_actr7/python

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev

      - name: test
        run: cargo test --locked --manifest-path rust_actr7/Cargo.toml

      - name: build binary
        run: cargo build --release --locked --features env --manifest-path rust_actr7/Cargo.toml

      - name: build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: rust_actr7/python
          manylinux: "2_17"
          args: --release --locked --out ../../dist/wheels

      - name: smoke test and stage
        run: |
          wheel=$(ls dist/wheels/rust_actr-*.whl | head -n 1)
          python -m pip install --force-reinstall --no-deps "$wheel"
          python rust_actr7/python/tutorial/unit1/count.py > /dev/null
          python rust_actr7/python/tutorial/unit5/grouped.py > /dev/null
          python scripts/stage_release.py \
            --platform linux-x86_64 \
            --binary rust_actr7/target/release/actr \
            --wheel "$wheel" \
            --dist dist \
            --zip

      - uses: actions/upload-artifact@v4
        with:
          name: actr-linux-x86_64
          path: dist/actr-*-linux-x86_64.zip
          if-no-files-found: error

  release:
    name: publish
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        run: |
          cd dist
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
