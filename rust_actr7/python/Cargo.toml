[package]
name = "rust-actr-python"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the Rust ACT-R engine"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
actr-engine = { path = ".." }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
