<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACT-R in the browser</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .75rem; }
  .controls { display: flex; gap: 1.25rem; align-items: flex-end;
              flex-wrap: wrap; margin-bottom: .75rem; }
  label { display: block; font-weight: 600; margin-bottom: .2rem; }
  input[type=number], select { padding: .3rem; font: inherit; }
  input[type=number] { width: 5.5rem; }
  select { min-width: 15rem; }
  button { padding: .5rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { cursor: default; opacity: .6; }
  #status { margin-left: auto; opacity: .7; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  textarea {
    width: 100%; height: 62vh; padding: .4rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45;
    white-space: pre; overflow: auto; resize: vertical;
  }
  #output { background: color-mix(in srgb, currentColor 6%, transparent); }
  #output.err { color: #b00020; }
  .help { cursor: help; border-bottom: 1px dotted currentColor; }
</style>
</head>
<body>
  <h1>ACT-R 7 — run a model in the browser</h1>

  <div class="controls">
    <div>
      <label for="model-preset">Model</label>
      <select id="model-preset" disabled>
        <option>Loading models…</option>
      </select>
    </div>
    <div>
      <label for="seed0">Seed</label>
      <input id="seed0" type="number" value="100">
    </div>
    <div>
      <label for="seed1">Advance (<span class="help"
        title="The seed is a pair (S C), as in ACT-R's (sgp :seed (S C)): S initializes the random generator, and C discards that many draws before the first real one (0 = fresh start). Same model and seed gives an identical trace; change either number and the noise comes out differently.">?</span>)</label>
      <input id="seed1" type="number" value="0">
    </div>
    <div>
      <label for="secs">Run time (s)</label>
      <input id="secs" type="number" value="10" min="0" step="0.5">
    </div>
    <button id="run" disabled>Run model</button>
    <span id="status">loading wasm…</span>
  </div>

  <div class="grid">
    <div>
      <label for="model">Model source</label>
      <textarea id="model" spellcheck="false" placeholder="Loading model…"></textarea>
    </div>
    <div>
      <label for="output">Trace</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>
  </div>

<script type="module">
"use strict";

const $ = (id) => document.getElementById(id);
let wasm = null;
let modelReady = false;
let modelRequest = 0;

function updateRunButton() {
  $("run").disabled = !(wasm && modelReady);
}

// Load the C-ABI module. `arrayBuffer` + `instantiate` (not streaming) so it
// works regardless of the `.wasm` MIME type the static server sends.
async function loadWasm() {
  const res = await fetch("./actr_engine.wasm");
  if (!res.ok) throw new Error(`fetch actr_engine.wasm: ${res.status} ${res.statusText}`);
  const { instance } = await WebAssembly.instantiate(await res.arrayBuffer(), {});
  return instance.exports;
}

// Mirror of the node harness: copy the source into wasm memory, run, read back.
function runModelInWasm(source, seed0, seed1, secs) {
  const bytes = new TextEncoder().encode(source);
  const ptr = wasm.alloc(bytes.length);
  let status;
  try {
    new Uint8Array(wasm.memory.buffer, ptr, bytes.length).set(bytes);
    status = wasm.run_model(ptr, bytes.length, BigInt(seed0), BigInt(seed1), secs);
  } finally {
    wasm.dealloc(ptr, bytes.length);
  }
  const rptr = wasm.result_ptr();
  const rlen = wasm.result_len();
  const out = new TextDecoder().decode(new Uint8Array(wasm.memory.buffer, rptr, rlen));
  return { ok: status === 0, out };
}

async function loadSelectedModel() {
  const select = $("model-preset");
  const option = select.selectedOptions[0];
  if (!option || !option.dataset.path) return;

  const request = ++modelRequest;
  modelReady = false;
  updateRunButton();
  $("status").textContent = "loading model…";
  $("output").value = "";
  $("output").classList.remove("err");

  try {
    const res = await fetch(`./models/${option.dataset.path}`, { cache: "no-store" });
    if (!res.ok) {
      throw new Error(`fetch models/${option.dataset.path}: ${res.status} ${res.statusText}`);
    }
    const source = await res.text();
    if (request !== modelRequest) return;
    $("model").value = source;
    modelReady = true;
    $("status").textContent = "";
  } catch (e) {
    if (request !== modelRequest) return;
    $("status").textContent = "model failed to load";
    $("output").value = String(e) + "\n\nDid you run web/build.py --models-only?";
    $("output").classList.add("err");
  } finally {
    if (request === modelRequest) updateRunButton();
  }
}

async function loadModels() {
  const select = $("model-preset");
  const res = await fetch("./models/manifest.json", { cache: "no-store" });
  if (!res.ok) {
    throw new Error(`fetch models/manifest.json: ${res.status} ${res.statusText}`);
  }
  const manifest = await res.json();
  const groups = Array.isArray(manifest.groups) ? manifest.groups : [];
  if (!groups.length) throw new Error("model manifest has no groups");

  select.replaceChildren();
  for (const group of groups) {
    const optgroup = document.createElement("optgroup");
    optgroup.label = String(group.label || group.id);
    for (const model of Array.isArray(group.models) ? group.models : []) {
      if (!model || !model.id || !model.path) continue;
      const option = document.createElement("option");
      option.value = String(model.id);
      option.textContent = String(model.label || model.id);
      option.dataset.path = String(model.path);
      optgroup.append(option);
    }
    if (optgroup.children.length) select.append(optgroup);
  }
  if (!select.options.length) throw new Error("model manifest has no models");

  select.disabled = false;
  const defaultId = String(manifest.default || "");
  if ([...select.options].some((option) => option.value === defaultId)) {
    select.value = defaultId;
  } else {
    select.selectedIndex = 0;
  }
  await loadSelectedModel();
}

function run() {
  if (!wasm || !modelReady) return;

  const source = $("model").value;
  const seed0 = Math.trunc(Number($("seed0").value) || 0);
  const seed1 = Math.trunc(Number($("seed1").value) || 0);
  const secs = Number($("secs").value) || 0;

  $("run").disabled = true;
  $("status").textContent = "running…";
  const t0 = performance.now();
  try {
    const { ok, out } = runModelInWasm(source, seed0, seed1, secs);
    $("output").value = out;
    $("output").classList.toggle("err", !ok);
    const ms = Math.round(performance.now() - t0);
    const lines = out ? out.split("\n").length : 0;
    $("status").textContent = `${ok ? "ok" : "error"} · ${ms} ms · ${lines} lines`;
  } catch (e) {
    $("output").value = "error: " + e;
    $("output").classList.add("err");
    $("status").textContent = "error";
  } finally {
    updateRunButton();
  }
}

(async function main() {
  $("model-preset").addEventListener("change", () => {
    void loadSelectedModel();
  });

  try {
    $("status").textContent = "loading models…";
    await loadModels();
  } catch (e) {
    $("status").textContent = "models failed to load";
    $("output").value = String(e) + "\n\nDid you run web/build.py --models-only?";
    $("output").classList.add("err");
    return;
  }

  try {
    $("status").textContent = "loading wasm…";
    wasm = await loadWasm();
  } catch (e) {
    $("status").textContent = "wasm failed to load";
    $("output").value =
      String(e) + "\n\nDid you run web/build.py, and serve this folder over HTTP?\n" +
      "  cd web && python -m http.server 8000";
    $("output").classList.add("err");
    return;
  }

  $("status").textContent = modelReady ? "" : "model failed to load";
  updateRunButton();
  $("run").addEventListener("click", run);
  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      run();
    }
  });
})();
</script>
</body>
</html>
