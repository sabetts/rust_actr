<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACT-R in the browser</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 system-ui, sans-serif; margin: 0; padding: 1rem; }
  h1 { font-size: 1.05rem; margin: 0 0 .75rem; }
  .controls { display: flex; gap: 1.25rem; align-items: flex-end;
              flex-wrap: wrap; margin-bottom: .75rem; }
  label { display: block; font-weight: 600; margin-bottom: .2rem; }
  input[type=number], select { padding: .3rem; font: inherit; }
  input[type=number] { width: 5.5rem; }
  select { min-width: 15rem; }
  button { padding: .5rem 1.1rem; font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { cursor: default; opacity: .6; }
  #status { margin-left: auto; opacity: .7; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  textarea {
    width: 100%; height: 62vh; padding: .4rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px; line-height: 1.45;
    white-space: pre; overflow: auto; resize: vertical;
  }
  #output { background: color-mix(in srgb, currentColor 6%, transparent); }
  #output.err { color: #b00020; }
  .help { cursor: help; border-bottom: 1px dotted currentColor; }
  .task-panel { display: flex; gap: 1rem; align-items: flex-start;
                flex-wrap: wrap; margin-bottom: .75rem; }
  .agi-window { border: 1px solid color-mix(in srgb, currentColor 35%, transparent);
                background: #fff; color: #000; }
  .agi-title { padding: .2rem .4rem; font-size: 12px; font-weight: 600;
               background: #e8e8e8; border-bottom: 1px solid #bbb; }
  .agi-surface { position: relative; overflow: hidden; background: #fff; }
  .agi-text { position: absolute; white-space: pre; line-height: 1.2;
              font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .agi-button { position: absolute; font: inherit; font-size: 12px;
                border: 1px solid #555; color: #000; }
  .agi-line { position: absolute; height: 1px; transform-origin: 0 0; }
  .agi-image { position: absolute; object-fit: contain; }
  .agi-attention, .agi-cursor { position: absolute; width: 8px; height: 8px;
                                border-radius: 50%; transform: translate(-50%, -50%);
                                pointer-events: none; }
  .agi-attention { box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 30%, transparent); }
  .task-stage { display: flex; flex-direction: column; gap: .55rem; min-width: 22rem; }
  .bj-table { border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
              border-radius: .4rem; padding: .7rem; background: #0b5d3b; color: #fff; }
  .bj-row { display: flex; align-items: center; gap: .5rem; min-height: 2.2rem; }
  .bj-label { width: 3.5rem; font-weight: 700; }
  .bj-card { display: inline-flex; align-items: center; justify-content: center;
             min-width: 2.2rem; height: 3rem; padding: 0 .35rem;
             border-radius: .25rem; background: #fff; color: #111;
             font-weight: 700; font-variant-numeric: tabular-nums; }
  .bj-card.hidden-card { background: repeating-linear-gradient(45deg,#1d4ed8,#1d4ed8 6px,#fff 6px,#fff 12px); color: transparent; }
  .bj-result { min-height: 1.4rem; font-weight: 700; }
  .bj-actions { display: flex; gap: .6rem; align-items: center; }
  .bj-status { opacity: .8; }
  .task-result { font-variant-numeric: tabular-nums; opacity: .85; padding-top: .2rem; }
  .task-controls { display: flex; gap: .85rem; align-items: flex-end; flex-wrap: wrap; }
  .task-control label { margin-bottom: .15rem; }
  .task-control input[type=number] { width: 5.5rem; }
  .task-control select { min-width: 10rem; }
  .task-report { white-space: pre-wrap; margin: 0; padding: .4rem;
                 background: color-mix(in srgb, currentColor 6%, transparent);
                 font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                 font-size: 12px; }
</style>
</head>
<body>
  <h1>ACT-R 7 â€” run a model in the browser</h1>

  <div class="controls">
    <div>
      <label for="model-preset">Model</label>
      <select id="model-preset" disabled>
        <option>Loading modelsâ€¦</option>
      </select>
    </div>
    <div>
      <label for="seed0">Seed</label>
      <input id="seed0" type="number" value="100">
    </div>
    <div>
      <label for="seed1">Advance (<span class="help"
        title="The seed is a pair (S C), as in ACT-R's (sgp :seed (S C)): S initializes the random generator, and C discards that many draws before the first real one (0 = fresh start). Same model and seed gives an identical trace; change either number and the noise comes out differently.">?</span>)</label>
      <input id="seed1" type="number" value="0">
    </div>
    <div>
      <label for="secs">Run time (s)</label>
      <input id="secs" type="number" value="10" min="0" step="0.5">
    </div>
    <button id="run" disabled>Run model</button>
    <span id="status">loading wasmâ€¦</span>
  </div>

  <section id="task-panel" class="task-panel" hidden>
    <div id="task-controls" class="task-controls" hidden></div>
    <div id="task-stage" class="task-stage" hidden></div>
    <div id="agi-window" class="agi-window" hidden>
      <div class="agi-title"></div>
      <div class="agi-surface"></div>
    </div>
    <div id="task-result" class="task-result"></div>
    <pre id="task-report" class="task-report" hidden></pre>
  </section>

  <div class="grid">
    <div>
      <label for="model">Model source</label>
      <textarea id="model" spellcheck="false" placeholder="Loading modelâ€¦"></textarea>
    </div>
    <div>
      <label for="output">Trace</label>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>
  </div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
